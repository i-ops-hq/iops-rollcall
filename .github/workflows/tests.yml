name: tests

# Third-party actions are pinned to a commit, not a tag: a tag can be moved to other code, and
# these workflows check this repository out and run it. The trailing comment is the release that
# commit is, so moving one is a deliberate edit rather than something that happens to us.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The full matrix weekly. macOS bills at ten times Linux and this repo is private, so the
    # every-push run is deliberately narrow — the same trim the sibling repos already carry.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      # macOS and Linux only. Windows process trees and signals differ enough that a half-working
      # path there would break the "degrades honestly" rule in the one place it matters most.
      # The parentheses are load-bearing. `&&` binds tighter than `||`, so without them a push
      # short-circuits the whole expression to the boolean `true`, `fromJSON(true)` is not a list,
      # and the run produces ZERO jobs while reporting failure — a green-looking workflow that ran
      # nothing. It went unnoticed for one run because the run before it was a manual dispatch,
      # which takes the other branch.
      matrix:
        include: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request')
          && '[{"os":"ubuntu-latest","node":"20"},{"os":"ubuntu-latest","node":"22"},{"os":"ubuntu-latest","node":"24"},{"os":"macos-latest","node":"22"}]'
          || '[{"os":"ubuntu-latest","node":"18"},{"os":"ubuntu-latest","node":"20"},{"os":"ubuntu-latest","node":"22"},{"os":"ubuntu-latest","node":"24"},{"os":"macos-latest","node":"18"},{"os":"macos-latest","node":"20"},{"os":"macos-latest","node":"22"},{"os":"macos-latest","node":"24"}]') }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      # First, and never gated behind the tests: when a platform surprises this tool, the surprise
      # is in this output, and a step that only runs on success cannot tell you why it failed.
      # `ps -o comm` is a full path on macOS and a truncated command NAME on Linux, which is why
      # the reader falls back to /proc/<pid>/exe there.
      - name: What this platform actually reports
        if: always()
        run: |
          echo "--- ps -axo pid=,comm= (first 5) ---"
          /bin/ps -axo pid=,comm= | head -5 || true
          echo "--- how many comm values carry a path ---"
          /bin/ps -axo comm= | grep -c "/" || true
          echo "--- /proc/self/exe ---"
          (test -e /proc/self/exe && readlink /proc/self/exe) || echo "no /proc on this platform"
          echo "--- args, first 5, and how many are bracketed kernel threads ---"
          /bin/ps -axo pid=,args= | head -5 || true
          echo "bracketed: $(/bin/ps -axo args= | grep -c '^\[' || true) of $(/bin/ps -axo args= | wc -l)"
          echo "--- how many /proc/<pid>/exe this user can actually read ---"
          node -e "
            const { readlinkSync } = require('fs');
            const { execFileSync } = require('child_process');
            const pids = execFileSync('/bin/ps', ['-axo','pid=']).toString().trim().split(/\s+/);
            let ok = 0, denied = 0;
            for (const pid of pids) {
              try { readlinkSync('/proc/' + pid + '/exe'); ok++; } catch (e) { denied++; }
            }
            console.log('readable', ok, 'unreadable', denied, 'of', pids.length);
          "
      - name: No dependencies, and this is the pitch rather than a detail
        run: |
          node -e "
            const p = require('./package.json');
            const n = Object.keys(p.dependencies || {}).length;
            if (n) { console.error(n + ' dependencies declared; this ships zero'); process.exit(1); }
          "
      - run: node --test test/*.test.js
      - name: It runs here and reports its own coverage
        if: always()
        run: node src/cli.js list && node src/cli.js stop --dry-run || true
