name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux only. Windows process trees and signals differ enough that a
        # half-working path there would break the "degrades honestly" rule in the one place it
        # matters most, so it is unsupported and says so.
        os: [ubuntu-latest, macos-latest]
        node: ["18", "20", "22", "24"]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: No dependencies, and the lockfile says so
        run: |
          test ! -s package-lock.json || node -e "
            const l = require('./package-lock.json');
            const deps = Object.keys(l.packages || {}).filter(k => k && !k.startsWith('node_modules/.'));
            if (deps.length) { console.error('dependencies appeared:', deps); process.exit(1); }
          "
          node -e "
            const p = require('./package.json');
            const n = Object.keys(p.dependencies || {}).length;
            if (n) { console.error(n + ' dependencies declared; this ships zero'); process.exit(1); }
          "
      - run: node --test test/*.test.js
      - name: It runs on this machine and reports its own coverage
        run: node src/cli.js list && node src/cli.js stop --dry-run || true
